<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel de Usuario - Epsilon</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<script>

if(localStorage.getItem("logueado") !== "si"){

    window.location.href = "login.html";

}

</script>



<header>


    <div class="logo">

        <a href="index.html">

            <img src="logo.png" alt="Epsilon">

        </a>

    </div>




    <div class="header-actions">

        <div id="usuario" class="usuario"></div>

        <div class="menu-toggle" onclick="toggleMenu()">

            ☰

        </div>


    </div>




    <nav id="menu">


        <ul>


            <li>

                <button class="link-button"
                onclick="window.location.href='gestion.html'">

                    Gestión

                </button>

            </li>



            <li>

                <button class="link-button"
                onclick="window.location.href='panelregistro.html'">

                    Panel Registro

                </button>

            </li>



            <li>

                <button class="link-button"
                onclick="window.location.href='panelcontenedor.html'">

                    Contenedores

                </button>

            </li>



            <li>

                <button class="link-button"
                onclick="window.location.href='panelcamion.html'">

                    Camiones

                </button>

            </li>



            <li>

                <button class="link-button"
                onclick="window.location.href='panelusuario.html'">

                    Panel de Usuario

                </button>

            </li>



        </ul>


    </nav>


</header>





<div class="pagina">



    <h2>

        Panel de Usuario

    </h2>



    <p>

        Administración de usuarios del sistema.

    </p>




    <div class="panel">


        <button>

            Crear Usuario

        </button>


        <button onclick="abrirModalUsuarios()">

            Modificar Usuario

        </button>


        <button>

            Eliminar Usuario

        </button>



    </div>




    <div class="lista-panel">


        <h3>

            Lista de Usuarios

        </h3>



        <ul>


            <li>

                Juan Pérez - Activo

            </li>



            <li>

                Ana López - Activo

            </li>



            <li>

                Carlos Rodríguez - Suspendido

            </li>


        </ul>



    </div>



</div>



<!-- Ventana flotante para modificar usuario -->

<div class="overlay" id="overlayUsuarios" onclick="cerrarModalUsuarios(event)">

    <div class="modal-usuarios">

        <h3>Seleccionar Usuario a Modificar</h3>

        <ul>

            <li onclick="seleccionarUsuario('Juan Pérez')">Juan Pérez</li>
            <li onclick="seleccionarUsuario('Ana López')">Ana López</li>
            <li onclick="seleccionarUsuario('Carlos Rodríguez')">Carlos Rodríguez</li>

        </ul>

    </div>

</div>



<script>


function toggleMenu(){

    document
    .getElementById("menu")
    .classList.toggle("activo");

}


function cerrarSesion(){

    localStorage.removeItem("logueado");

    window.location.href = "index.html";

}


function cargarUsuario(){

    document.getElementById("usuario").innerHTML = `

    <button class="usuario-btn" onclick="abrirUsuario()">
        👤
    </button>

    <div id="menuUsuario" class="menu-usuario">

        <button onclick="cerrarSesion()">
            Cerrar Sesión
        </button>

    </div>

    `;

}


function abrirUsuario(){

    document
    .getElementById("menuUsuario")
    .classList.toggle("activo");

}


cargarUsuario();


function abrirModalUsuarios(){

    document
    .getElementById("overlayUsuarios")
    .classList.add("activo");

}


function cerrarModalUsuarios(evento){

    if(evento.target.id === "overlayUsuarios"){

        document
        .getElementById("overlayUsuarios")
        .classList.remove("activo");

    }

}


function seleccionarUsuario(nombre){

    alert("Modificando a: " + nombre);

    document
    .getElementById("overlayUsuarios")
    .classList.remove("activo");

}


</script>



</body>

</html>
